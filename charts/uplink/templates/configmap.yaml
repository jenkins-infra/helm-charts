apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "uplink.fullname" . }}
  labels:
{{ include "uplink.labels" . | indent 4 }}
data:
  production.json: |
    {
      "host": "uplink.jenkins.io",
      "port": 3030,
      "public": "../public/",
      "authentication": {
        "secret": "a poorly formed production secret",
        "session" : true,
        "cookie" : {
          "secure": false,
          "enabled": true,
          "name": "uplink-jwt"
        }
      },
      "paginate": {
      "default": 10,
      "max": 50
      }
    }
